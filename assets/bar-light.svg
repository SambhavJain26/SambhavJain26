<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="88" viewBox="0 0 1200 88" role="img" aria-label="jainsambhav.com: a little curiosity, a lot of building">
<title>jainsambhav.com</title>
<defs>
<style>
@font-face{font-family:'ISerif';font-style:normal;font-weight:400;src:url(data:font/ttf;base64,) format('truetype');}
.mono{font-family:'ISerif','Instrument Serif',Georgia,'Times New Roman',serif;font-size:44px;fill:#191a1c}
.tag{font:600 13px 'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:3.4px;fill:#62636a}
.url{font:500 16px 'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif;fill:#191a1c}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.6}}
.arrow{animation:nudge 3s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(2px,-2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.in{opacity:1!important}}
</style>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.15" fill="#c6cad1"/></pattern>
<clipPath id="frame"><rect width="1200" height="88" rx="18"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="88" fill="#fafaf9"/>
<rect width="1200" height="88" fill="url(#dots)" opacity=".7"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="86.5" rx="17.5" fill="none" stroke="#dededb" stroke-width="1.5"/>
<text class="mono" x="40" y="58">sj</text>
<circle class="pulse" cx="68" cy="55" r="4.2" fill="#e6243f"/>
<text class="tag" x="600.0" y="49" text-anchor="middle">A LITTLE CURIOSITY. A LOT OF BUILDING.</text>
<rect x="958" y="22" width="206" height="44" rx="22" fill="#ffffff" stroke="#dededb" stroke-width="1.5"/>
<text class="url" x="982" y="49">jainsambhav.com</text>
<g class="arrow"><path d="M1132 50 L1144 38 M1136 38 H1144 V46" fill="none" stroke="#191a1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
