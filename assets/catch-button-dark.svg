<svg xmlns="http://www.w3.org/2000/svg" width="440" height="76" viewBox="0 0 440 76" role="img" aria-label="Catch a bug">
<defs><style>
@font-face{font-family:'ISerif';font-style:normal;font-weight:400;src:url(data:font/ttf;base64,) format('truetype');}
.l{font-family:'ISerif','Instrument Serif',Georgia,'Times New Roman',serif;font-size:32px;fill:#14161b}
.s{font:500 12px 'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px;fill:#14161b;opacity:.7}
.net{transform-box:fill-box;transform-origin:20% 90%;animation:swing 2.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}
.bug{animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.in{opacity:1!important}}
</style></defs>
<rect width="440" height="76" rx="38.0" fill="#f2f2f0"/>
<g class="net" stroke="#14161b" stroke-width="2.4" fill="none" stroke-linecap="round">
<line x1="40" y1="56" x2="56" y2="38"/>
<ellipse cx="64" cy="29" rx="13" ry="10" transform="rotate(-40 64 29)"/>
<path d="M56 23 L72 35 M60 19 L75 31 M54 29 L66 39" stroke-width="1.2" opacity=".7"/>
</g>
<g class="bug"><ellipse cx="96" cy="44" rx="6" ry="7.5" fill="#ed4056"/><circle cx="96" cy="35" r="3.6" fill="#ed4056"/></g>
<text class="l" x="124" y="47">Catch a bug</text>
<text class="s" x="300" y="44">PLAY  →</text>
</svg>
