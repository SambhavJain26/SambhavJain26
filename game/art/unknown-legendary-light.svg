<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Undiscovered Legendary bug">
<defs><style>@font-face{font-family:'ISerif';font-style:normal;font-weight:400;src:url(data:font/ttf;base64,) format('truetype');}
.ants{stroke-dasharray:12 7;animation:ants 8s linear infinite}
@keyframes ants{to{stroke-dashoffset:-190}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.spk{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
.sheen{animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-160px)}100%{transform:translateX(260px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.in{opacity:1!important}}
</style>
<radialGradient id="glow" cx="50%" cy="56%" r="58%"><stop offset="0" stop-color="#e6a400" stop-opacity=".32"/><stop offset="1" stop-color="#e6a400" stop-opacity="0"/></radialGradient>
<clipPath id="tile"><rect x="3" y="3" width="194" height="194" rx="24"/></clipPath>
</defs>
<rect x="3" y="3" width="194" height="194" rx="24" fill="#ffffff"/>
<g clip-path="url(#tile)"><rect width="200" height="200" fill="url(#glow)"/>
<rect class="sheen" x="0" y="-20" width="34" height="240" fill="#fff" opacity=".35" transform="skewX(-20)"/></g>
<rect class="ants" x="3" y="3" width="194" height="194" rx="24" fill="none" stroke="#e6a400" stroke-width="3"/>
<path class="spk" style="animation-delay:0.00s" transform="translate(34 46)" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" fill="#e6a400"/><path class="spk" style="animation-delay:0.55s" transform="translate(166 58)" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" fill="#e6a400"/><path class="spk" style="animation-delay:1.10s" transform="translate(40 150)" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" fill="#e6a400"/><path class="spk" style="animation-delay:1.65s" transform="translate(164 146)" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" fill="#e6a400"/><path class="spk" style="animation-delay:2.20s" transform="translate(100 186)" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2Z" fill="#e6a400"/>
<g class="bob"><g fill="none" stroke="#e6a400" stroke-width="4" stroke-linecap="round" opacity=".55"><path d="M66 96 Q44 88 30 104"/><path d="M66 118 Q44 110 30 126"/><path d="M66 140 Q44 132 30 148"/><path d="M134 96 Q156 88 170 104"/><path d="M134 118 Q156 110 170 126"/><path d="M134 140 Q156 132 170 148"/><path d="M92 40 Q84 18 70 16 M108 40 Q116 18 130 16"/></g><ellipse cx="100" cy="114" rx="40" ry="48" fill="#e6a400" fill-opacity=".30" stroke="#e6a400" stroke-opacity=".6" stroke-width="2"/><circle cx="100" cy="54" r="22" fill="#e6a400" fill-opacity=".30" stroke="#e6a400" stroke-opacity=".6" stroke-width="2"/><path d="M82 34 L86 16 L94 27 L100 12 L106 27 L114 16 L118 34Z" fill="none" stroke="#e6a400" stroke-width="2.5" stroke-linejoin="round" opacity=".8"/>
<circle class="ring" cx="100" cy="116" r="22" fill="none" stroke="#e6a400" stroke-width="2.5"/>
<circle cx="100" cy="116" r="22" fill="#e6a400"/>
<text x="100" y="128" text-anchor="middle" style="font-family:'ISerif','Instrument Serif',Georgia,'Times New Roman',serif;font-size:34px" fill="#fff">?</text></g>
</svg>
