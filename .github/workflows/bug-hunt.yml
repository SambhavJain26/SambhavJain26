name: Bug Hunt

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created] # players answer the bot's challenge in a comment
  schedule:
    - cron: "23 */6 * * *" # sweep up anything a busy moment skipped, and let unanswered bugs crawl away
  workflow_dispatch:

permissions: {}

# One run at a time, so two hunts never overwrite each other's state. A run that gets
# skipped while another is queued loses nothing: every run re-reads all open hunts.
concurrency:
  group: bug-hunt
  cancel-in-progress: false

jobs:
  play:
    # Ignore ordinary issues, PRs and the bot's own comments; Python re-checks everything strictly.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'bughunt')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.issue.title, 'bughunt') &&
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Untrusted issue titles are never put into this file or a shell: Python
      # fetches them with `gh` and only matches them against a fixed pattern.
      - name: Process hunts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m game.play process

      - name: Save the Bugdex
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/state.json README.md
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "bughunt: update Bugdex"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1

      - name: Reply to hunters
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m game.play deliver

  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
